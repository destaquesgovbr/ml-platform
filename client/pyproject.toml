[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dgb-mlflow"
version = "0.1.0"
description = "Cliente helper do MLflow para o Destaques Gov.BR (esconde IAP + tracking remoto)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Destaques Gov.BR — Data Science" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mlflow==3.13.0",
    "google-auth>=2.30,<3",
    "google-cloud-storage>=2.16,<3",
]

[project.urls]
Homepage = "https://github.com/destaquesgovbr/ml-platform"
Repository = "https://github.com/destaquesgovbr/ml-platform"
Issues = "https://github.com/destaquesgovbr/ml-platform/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

# Entry point para o MLflow descobrir o provider de headers via plugin system.
# Assim, qualquer chamada do tracking client passa pelo IAPRequestHeaderProvider.
[project.entry-points."mlflow.request_header_provider"]
dgb_mlflow = "dgb_mlflow.headers:IAPRequestHeaderProvider"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
